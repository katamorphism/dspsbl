<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test CSW Loader</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, monospace;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 12px;
            overflow-x: auto;
        }
        .success { color: #7ee787; }
        .error { color: #ff6b6b; }
        .warn { color: #ffa657; }
        pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; }
        .small { font-size: 13px; color: #8b949e; }
    </style>
</head>
<body>

    <h1>🔍 CSW24 Debug</h1>

    <div id="output"></div>

    <script>
        (async function() {
            const output = document.getElementById('output');

            try {
                const response = await fetch('csw24.txt');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} - File not found`);
                }

                const text = await response.text();

                // === SHOW RAW FILE INFO ===
                let html = `<div class="box"><strong>📄 File Info</strong><br>`;
                html += `Size: ${text.length.toLocaleString()} characters<br>`;
                html += `First 200 chars: <pre>${text.substring(0, 200).replace(/&/g, '&amp;').replace(/</g, '&lt;')}</pre>`;
                html += `</div>`;

                // === COUNT WORDS ===
                const words = text.split(/\r?\n/).map(w => w.trim()).filter(w => w.length > 0);
                
                html += `<div class="box"><strong>📊 After Splitting</strong><br>`;
                html += `Total words: ${words.length.toLocaleString()}<br>`;
                html += `First 10 words: ${words.slice(0, 10).join(', ')}<br>`;
                html += `</div>`;

                // === FIND 7-LETTER WORDS ===
                const sevenWords = words.filter(w => w.length === 7);
                const sevenLetters = sevenWords.filter(w => /^[a-zA-Z]+$/.test(w));

                html += `<div class="box"><strong>🔍 Results</strong><br>`;
                html += `Words with exactly 7 characters: ${sevenWords.length.toLocaleString()}<br>`;
                html += `7-letter words (letters only): ${sevenLetters.length.toLocaleString()}<br>`;

                if (sevenLetters.length > 0) {
                    html += `<span class="success">✅ Found ${sevenLetters.length} words!</span><br>`;
                    html += `Sample: ${sevenLetters.slice(0, 20).join(', ')}`;
                } else if (words.length === 0) {
                    html += `<span class="error">❌ No words found — check if file is empty</span>`;
                } else if (sevenWords.length === 0 && words.length > 0) {
                    html += `<span class="error">❌ No 7-letter words found. Here's the length distribution:</span><br>`;
                    // Count length distribution
                    const lengths = {};
                    words.slice(0, 1000).forEach(w => {
                        const len = w.length;
                        lengths[len] = (lengths[len] || 0) + 1;
                    });
                    html += `Sample lengths (first 1000 words): `;
                    const sortedLengths = Object.entries(lengths).sort((a,b) => a[0] - b[0]);
                    html += sortedLengths.map(([len, count]) => `${len} (${count})`).join(', ');
                    html += `<br><span class="warn">💡 If all words are 3-4 letters, you might have the wrong file.</span>`;
                } else if (sevenWords.length > 0 && sevenLetters.length === 0) {
                    html += `<span class="error">❌ ${sevenWords.length} words are 7 chars but contain special characters.</span><br>`;
                    html += `Sample: ${sevenWords.slice(0, 10).join(', ')}`;
                }

                html += `</div>`;

                // === FORMAT OUTPUT IF FOUND ===
                if (sevenLetters.length > 0) {
                    sevenLetters.sort();
                    const formatted = sevenLetters.map(w => `  "${w.toLowerCase()}"`);
                    let outputText = '[\n';
                    if (formatted.length > 0) {
                        outputText += formatted.join(',\n');
                        outputText += '\n';
                    }
                    outputText += ']';

                    html += `<div class="box"><strong>📝 Output</strong><br>`;
                    html += `<pre>${outputText}</pre>`;
                    html += `</div>`;
                }

                output.innerHTML = html;

            } catch (err) {
                output.innerHTML = `<div class="box error">❌ Error: ${err.message}</div>`;
                console.error(err);
            }
        })();
    </script>

</body>
</html>
